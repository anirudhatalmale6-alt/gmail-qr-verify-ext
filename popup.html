<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 350px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 16px;
    }
    .header {
      text-align: center;
      padding: 12px 0;
      border-bottom: 1px solid #333;
      margin-bottom: 16px;
    }
    .header h1 {
      font-size: 16px;
      color: #4fc3f7;
      margin-bottom: 4px;
    }
    .header p {
      font-size: 11px;
      color: #888;
    }
    .status-card {
      background: #16213e;
      border-radius: 8px;
      padding: 14px;
      margin-bottom: 12px;
      border-left: 3px solid #4fc3f7;
    }
    .status-label {
      font-size: 11px;
      color: #888;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 6px;
    }
    .status-value {
      font-size: 14px;
      font-weight: 600;
    }
    .status-idle { color: #888; }
    .status-scanning { color: #ffa726; }
    .status-verifying { color: #4fc3f7; }
    .status-success { color: #66bb6a; }
    .status-error { color: #ef5350; }
    .url-display {
      background: #0d1b2a;
      border-radius: 6px;
      padding: 10px;
      margin-top: 8px;
      font-size: 11px;
      word-break: break-all;
      color: #90caf9;
      max-height: 60px;
      overflow-y: auto;
    }
    .btn {
      display: block;
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 8px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-primary {
      background: #1a73e8;
      color: white;
    }
    .btn-secondary {
      background: #333;
      color: #ccc;
    }
    .info {
      font-size: 11px;
      color: #666;
      text-align: center;
      margin-top: 8px;
      line-height: 1.4;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      margin-right: 6px;
      vertical-align: middle;
    }
    .dot-idle { background: #555; }
    .dot-active { background: #66bb6a; animation: pulse 1.5s infinite; }
    .dot-working { background: #ffa726; animation: pulse 1s infinite; }
    .dot-error { background: #ef5350; }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    .log-area {
      background: #0d1b2a;
      border-radius: 6px;
      padding: 8px;
      margin-top: 12px;
      font-size: 10px;
      font-family: monospace;
      color: #78909c;
      max-height: 100px;
      overflow-y: auto;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Gmail QR Auto-Verify</h1>
    <p>Automatically handles Google QR verification</p>
  </div>

  <div class="status-card">
    <div class="status-label">Status</div>
    <div class="status-value" id="status">
      <span class="dot dot-idle" id="statusDot"></span>
      <span id="statusText">Idle - waiting for QR page</span>
    </div>
  </div>

  <div class="status-card" id="urlCard" style="display:none;">
    <div class="status-label">Decoded QR URL</div>
    <div class="url-display" id="qrUrl"></div>
  </div>

  <button class="btn btn-primary" id="rescanBtn">Rescan QR Code</button>
  <button class="btn btn-secondary" id="openUrlBtn" style="display:none;">Open URL Manually</button>

  <div class="info">
    Extension auto-activates on Google signup QR verification pages.
    It decodes the QR code, opens it with mobile headers, and tries to auto-verify.
  </div>

  <div class="log-area" id="logArea">Ready.</div>

  <script src="popup.js"></script>
</body>
</html>
