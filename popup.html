<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 340px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #1a1a2e;
      color: #e0e0e0;
      padding: 14px;
    }
    .header {
      text-align: center;
      padding: 8px 0 12px;
      border-bottom: 1px solid #333;
      margin-bottom: 12px;
    }
    .header h1 { font-size: 15px; color: #4fc3f7; margin-bottom: 2px; }
    .header p { font-size: 10px; color: #666; }
    .card {
      background: #16213e;
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 10px;
    }
    .card-label {
      font-size: 10px; color: #888;
      text-transform: uppercase; letter-spacing: 1px;
      margin-bottom: 4px;
    }
    .status-text { font-size: 13px; }
    .url-box {
      background: #0d1b2a;
      border-radius: 6px;
      padding: 8px;
      margin-top: 6px;
      font-size: 11px;
      word-break: break-all;
      color: #90caf9;
      max-height: 60px;
      overflow-y: auto;
      cursor: pointer;
      border: 1px solid transparent;
      transition: border-color 0.2s;
    }
    .url-box:hover { border-color: #4fc3f7; }
    .copied { border-color: #66bb6a !important; }
    .btn {
      display: block; width: 100%;
      padding: 10px; border: none; border-radius: 6px;
      font-size: 13px; font-weight: 600;
      cursor: pointer; margin-bottom: 6px;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn:active { transform: scale(0.98); }
    .btn-scan { background: #1a73e8; color: white; font-size: 14px; padding: 12px; }
    .btn-open { background: #2e7d32; color: white; }
    .btn-secondary { background: #333; color: #ccc; }
    .error-text { color: #ef5350; font-size: 11px; margin-top: 6px; }
    .success-text { color: #66bb6a; font-size: 12px; font-weight: 600; }
    .dot {
      display: inline-block; width: 8px; height: 8px;
      border-radius: 50%; margin-right: 6px; vertical-align: middle;
    }
    .dot-idle { background: #555; }
    .dot-scanning { background: #ffa726; animation: pulse 0.8s infinite; }
    .dot-decoded { background: #66bb6a; }
    .dot-error { background: #ef5350; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
    .info {
      font-size: 10px; color: #555;
      text-align: center; margin-top: 10px; line-height: 1.4;
    }
    .hidden { display: none; }
  </style>
</head>
<body>
  <div class="header">
    <h1>Gmail QR Auto-Verify</h1>
    <p>v2.0 - Click to scan</p>
  </div>

  <button class="btn btn-scan" id="scanBtn">Scan QR Code Now</button>

  <div class="card">
    <div class="card-label">Status</div>
    <div class="status-text" id="status">
      <span class="dot dot-idle" id="dot"></span>
      <span id="statusMsg">Ready - click the button above while on the QR page</span>
    </div>
    <div class="error-text hidden" id="errorMsg"></div>
  </div>

  <div class="hidden" id="resultSection">
    <div class="card">
      <div class="card-label">Decoded QR URL (click to copy)</div>
      <div class="url-box" id="urlBox"></div>
    </div>
    <button class="btn btn-open" id="openBtn">Open URL in New Tab</button>
  </div>

  <div class="info">
    Navigate to the Google QR verification page, then click "Scan QR Code Now".
    The extension reads the QR code and shows you the URL inside it.
  </div>

  <script src="popup.js"></script>
</body>
</html>
